name: wADB
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    CLANG_ENABLE_MODULES: YES
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  wADB:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: wADB
    info:
      path: wADB/Info.plist
      properties:
        CFBundleDisplayName: wADB
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        NSBonjourServices:
          - _adb-tls-pairing._tcp
          - _adb-tls-connect._tcp
        NSLocalNetworkUsageDescription: wADB discovers and reconnects paired Android devices on your local Wi-Fi network.
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: wADB
        PRODUCT_BUNDLE_IDENTIFIER: local.c5inco.wADB
        PRODUCT_NAME: wADB
        PRODUCT_MODULE_NAME: wADB
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
  wADBTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: wADBTests
    dependencies:
      - target: wADB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.c5inco.wADBTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/wADB.app/Contents/MacOS/wADB"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  wADB:
    build:
      targets:
        wADB: all
        wADBTests: [test]
    test:
      targets:
        - wADBTests
